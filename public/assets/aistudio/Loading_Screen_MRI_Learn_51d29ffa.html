<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>MRI Learn – Loading</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  color-scheme: dark;
  --bg:#050b14; --bg2:#0a1a28; --teal:#2dd4bf; --teal-d:#14917f;
  --text:#ffffff; --muted:#8fa3b5; --line:#16394f; --amber:#f59e0b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 45% at 50% 42%, #0f3a44 0%, rgba(5,11,20,0) 70%);
  color:var(--text);
  font-family:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:28px;overflow:hidden;text-align:center;padding:24px;
}
.stage{position:relative;width:min(64vw,260px);aspect-ratio:1}
.stage svg.icon{position:relative;width:100%;height:100%;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 14px 30px rgba(45,212,191,.28))}
.pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--teal);opacity:0;animation:pulse 2.8s ease-out infinite}
.pulse.p2{animation-delay:1.4s}
.spin{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);animation:rot 2.6s linear infinite}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.3px}
h1 span{color:var(--teal)}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.bar{width:min(70vw,280px);height:6px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal-d),var(--teal))}
.status{display:flex;justify-content:space-between;width:min(70vw,280px);margin-top:10px;font-size:12px;color:var(--muted)}
.status b{color:var(--teal);font-weight:600}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.45);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stage svg.icon,.pulse,.spin{animation:none}}
</style>
</head>
<body>
  <div class="stage">
    <div class="pulse"></div><div class="pulse p2"></div>
    <svg class="spin" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="48" stroke="#2dd4bf" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="60 242" opacity=".9"/>
    </svg>
    <svg class="icon" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ikon mesin MRI">
      <defs>
        <linearGradient id="bg" x1="0.1" y1="0.1" x2="0.9" y2="0.9"><stop offset="0" stop-color="#8AE5D9"/><stop offset="1" stop-color="#52B9D8"/></linearGradient>
        <clipPath id="body"><path d="M464 256 H620 C712 256 775 335 775 440 C775 518 742 578 702 620 H464 Z"/></clipPath>
      </defs>
      <g stroke-linejoin="round" stroke-linecap="round">
        <circle cx="450" cy="450" r="430" fill="url(#bg)"/>
        <ellipse cx="450" cy="652" rx="290" ry="22" fill="#2F86A8" opacity="0.35"/>
        <g clip-path="url(#body)">
          <rect x="464" y="256" width="320" height="364" fill="#C0DDF5"/>
          <rect x="464" y="338" width="320" height="117" fill="#96C6EE"/>
          <rect x="464" y="455" width="320" height="100" fill="#72ADE3"/>
          <rect x="464" y="555" width="320" height="70" fill="#528FD3"/>
          <g stroke="#0D2A6B" stroke-width="7" fill="none"><line x1="464" y1="338" x2="784" y2="338"/><line x1="464" y1="455" x2="784" y2="455"/><line x1="464" y1="555" x2="784" y2="555"/></g>
        </g>
        <path d="M464 256 H620 C712 256 775 335 775 440 C775 518 742 578 702 620 H464" fill="none" stroke="#0D2A6B" stroke-width="9"/>
        <rect x="583" y="598" width="128" height="27" rx="8" fill="#72ADE3" stroke="#0D2A6B" stroke-width="8"/>
        <circle cx="464" cy="437" r="181" fill="#E3EFFB" stroke="#0D2A6B" stroke-width="9"/>
        <circle cx="464" cy="437" r="158" fill="#BFDDF5" stroke="#0D2A6B" stroke-width="5"/>
        <circle cx="464" cy="437" r="140" fill="#FFFFFF" stroke="#0D2A6B" stroke-width="7"/>
        <g stroke="#0D2A6B" stroke-width="6" fill="#E3EFFB"><rect x="318" y="441" width="62" height="14" rx="3"/><rect x="530" y="441" width="62" height="14" rx="3"/></g>
        <circle cx="460" cy="448" r="74" fill="#4A82CC" stroke="#0D2A6B" stroke-width="7"/>
        <circle cx="470" cy="448" r="63" fill="#1E4FB5" stroke="#0D2A6B" stroke-width="6"/>
        <ellipse cx="502" cy="452" rx="24" ry="44" fill="#0F2468" stroke="#0D2A6B" stroke-width="5"/>
        <rect x="422" y="330" width="60" height="22" rx="7" fill="#1E4FB5" stroke="#0D2A6B" stroke-width="7"/>
        <rect x="190" y="520" width="262" height="30" rx="6" fill="#96C6EE" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="210" y="550" width="76" height="46" fill="#C0DDF5" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="286" y="550" width="150" height="46" fill="#72ADE3" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="210" y="596" width="76" height="29" rx="5" fill="#C0DDF5" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="286" y="596" width="144" height="29" rx="5" fill="#528FD3" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="128" y="492" width="395" height="30" rx="9" fill="#E8F2FC" stroke="#0D2A6B" stroke-width="8"/>
        <rect x="270" y="507" width="240" height="14" rx="5" fill="#3CC4A0" stroke="#0D2A6B" stroke-width="6"/>
      </g>
    </svg>
  </div>

  <div>
    <h1>Belajar <span>MRI</span></h1>
    <p class="sub">Radiologi Medis · MRI EDU</p>
  </div>

  <div>
    <div class="bar"><i id="fill"></i></div>
    <div class="status"><span id="msg">Menyiapkan aplikasi…</span><b id="pct">0%</b></div>
  </div>

<script>
(function(){
  var msgs=["Menyiapkan aplikasi…","Memuat materi…","Menyiapkan simulasi…","Hampir selesai…"];
  var fill=document.getElementById("fill"),pct=document.getElementById("pct"),msg=document.getElementById("msg");
  var dur=4200,t0=null;
  function step(t){
    if(t0===null)t0=t;
    var p=Math.min((t-t0)/dur,1);
    var e=1-Math.pow(1-p,2);
    var v=Math.round(e*100);
    fill.style.width=v+"%";pct.textContent=v+"%";
    msg.textContent=msgs[Math.min(Math.floor(p*msgs.length),msgs.length-1)];
    if(p<1){requestAnimationFrame(step)}else{setTimeout(function(){t0=null;requestAnimationFrame(step)},900)}
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
